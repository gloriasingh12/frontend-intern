<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduTech | Task 4</title>
    <style>
        :root { --primary: #4f46e5; --bg: #f9fafb; --card: #ffffff; --text: #111827; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; }
        
        /* Sidebar Navigation */
        .sidebar { width: 240px; background: #fff; height: 100vh; position: fixed; border-right: 1px solid #e5e7eb; padding: 20px; }
        .sidebar h2 { color: var(--primary); font-size: 1.5rem; }
        .nav-link { display: block; padding: 12px; color: #4b5563; text-decoration: none; border-radius: 8px; margin-bottom: 5px; }
        .nav-link.active { background: #eef2ff; color: var(--primary); font-weight: 600; }

        /* Main Content Area */
        .main { margin-left: 280px; padding: 40px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        
        /* Progress Card */
        .progress-box { background: var(--primary); color: white; padding: 20px; border-radius: 12px; margin-bottom: 30px; }
        .bar-bg { background: rgba(255,255,255,0.2); height: 10px; border-radius: 5px; margin-top: 10px; }
        .bar-fill { background: #fff; height: 100%; border-radius: 5px; width: 65%; }

        /* Course Grid */
        .course-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .course-card { background: white; border-radius: 12px; overflow: hidden; border: 1px solid #e5e7eb; transition: 0.3s; cursor: pointer; }
        .course-card:hover { transform: translateY(-5px); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
        .video-placeholder { background: #000; height: 160px; display: flex; align-items: center; justify-content: center; color: white; }
        .card-body { padding: 15px; }
        .badge { background: #dcfce7; color: #166534; padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; }

        .hidden { display: none; }
    </style>
</head>
<body>

<div class="sidebar">
    <h2>EduTech</h2>
    <a href="#" class="nav-link active" onclick="showTab('courses')">Dashboard</a>
    <a href="#" class="nav-link" onclick="showTab('player')">My Learning</a>
</div>

<div class="main">
    <div id="courses-tab">
        <div class="header">
            <h1>Welcome back, Aditya! 🎓</h1>
        </div>
        
        <div class="progress-box">
            <span>Overall Progress: 65%</span>
            <div class="bar-bg"><div class="bar-fill"></div></div>
        </div>

        <h2>Explore Courses</h2>
