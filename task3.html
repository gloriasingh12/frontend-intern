<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aditya Tripathi | Portfolio</title>
    <style>
        :root { --primary: #0a192f; --secondary: #64ffda; --text: #8892b0; --white: #e6f1ff; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--primary); color: var(--text); margin: 0; line-height: 1.6; }
        nav { background: rgba(10, 25, 47, 0.9); padding: 20px 10%; display: flex; justify-content: space-between; position: fixed; width: 80%; top: 0; z-index: 1000; }
        nav a { color: var(--secondary); text-decoration: none; font-weight: bold; margin-left: 20px; }
        
        header { height: 100vh; display: flex; flex-direction: column; justify-content: center; padding: 0 10%; }
        header h1 { color: var(--white); font-size: 3.5rem; margin: 0; }
        header span { color: var(--secondary); font-size: 1.2rem; font-family: monospace; }
        
        .section { padding: 80px 10%; }
        h2 { color: var(--white); border-bottom: 2px solid var(--secondary); display: inline-block; margin-bottom: 30px; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        .card { background: #112240; padding: 25px; border-radius: 10px; transition: 0.3s; border: 1px solid transparent; }
        .card:hover { transform: translateY(-10px); border-color: var(--secondary); }
        .card h3 { color: var(--white); margin-top: 0; }
        
        .btn { border: 1px solid var(--secondary); color: var(--secondary); padding: 10px 20px; text-decoration: none; border-radius: 5px; display: inline-block; margin-top: 20px; transition: 0.3s; }
        .btn:hover { background: rgba(100, 255, 218, 0.1); }
        
        @media (max-width: 768px) { header h1 { font-size: 2.5rem; } nav { width: 90%; padding: 20px 5%; } }
    </style>
</head>
<body>

<nav>
    <div style="color: var(--secondary); font-weight: bold;">AT.</div>
    <div>
        <a href="#about">About</a>
        <a href="#projects">Projects</a>
        <a href="#contact">Contact</a>
    </div>
</nav>

<header>
    <span>Hi, my name is</span>
    <h1>Aditya Tripathi.</h1>
    <h1 style="color: var(--text);">I build secure & scalable systems.</h1>
    <p style="max-width: 600px;">Final year IT student at SOIT specializing in Cloud, DevSecOps, and Embedded Systems. Completed 50+ technical tasks for Noida Expo 2026.</p>
    <div><a href="#projects" class="btn">View My Work</a></div>
</header>
