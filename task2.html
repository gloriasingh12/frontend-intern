<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Chat | Task 2</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #e5ddd5; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        #chat-container { width: 100%; max-width: 400px; height: 500px; background: white; border-radius: 10px; display: flex; flex-direction: column; box-shadow: 0 10px 25px rgba(0,0,0,0.2); overflow: hidden; }
        #chat-header { background: #075e54; color: white; padding: 15px; text-align: center; font-weight: bold; }
        #messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 8px 12px; border-radius: 8px; max-width: 75%; font-size: 0.9rem; position: relative; }
        .sent { align-self: flex-end; background: #dcf8c6; border-bottom-right-radius: 0; }
        .received { align-self: flex-start; background: #fff; border-bottom-left-radius: 0; border: 1px solid #ddd; }
        #input-area { padding: 10px; background: #f0f0f0; display: flex; gap: 10px; }
        input { flex: 1; border: none; padding: 10px; border-radius: 20px; outline: none; }
        button { background: #075e54; color: white; border: none; padding: 10px 15px; border-radius: 50%; cursor: pointer; transition: 0.3s; }
        button:hover { background: #128c7e; }
    </style>
</head>
<body>

<div id="chat-container">
    <div id="chat-header">TechAditya Live Chat 🟢</div>
    <div id="messages" id="message-list">
        <div class="msg received">Welcome! Start a real-time conversation.</div>
    </div>
    <div id="input-area">
        <input type="text" id="msg-input" placeholder="Type a message...">
        <button onclick="sendMessage()">➤</button>
    </div>
</div>

<script>
    const messageContainer = document.getElementById('messages');
    const inputField = document.getElementById('msg-input');

    function sendMessage() {
        const text = inputField.value.trim();
        if (text === "") return;

        // 1. Create Sent Message
        appendMessage(text, 'sent');
        inputField.value = "";

        // 2. Simulate Server Response (WebSocket Simulation)
        setTimeout(() => {
            const autoReply = "Server received: " + text;
            appendMessage(autoReply, 'received');
        }, 1000);
    }

    function appendMessage(text, type) {
        const msgDiv = document.createElement('div');
        msgDiv.className = `msg ${type}`;
        msgDiv.innerText = text;
        messageContainer.appendChild(msgDiv);
        
        // Auto-scroll to bottom
        messageContainer.scrollTop = messageContainer.scrollHeight;
    }

    // Allow "Enter" key to send message
    inputField.addEventListener("keypress", function(event) {
        if (event.key === "Enter") {
            sendMessage();
        }
    });
</script>

</body>
</html>
